# The OpenTelemetry Collector between the shop and trace-diff: OTLP in,
# the file exporter out, one file per run (PHASE).
receivers:
  otlp:
    protocols:
      http:
        endpoint: 0.0.0.0:4318
      grpc:
        endpoint: 0.0.0.0:4317

processors:
  batch: {}

exporters:
  file:
    path: /out/${env:PHASE}.jsonl

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [file]
